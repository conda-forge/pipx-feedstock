schema_version: 1

context:
  version: 1.17.13

package:
  name: pipx
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/pipx/pipx-${{ version }}.tar.gz
    sha256: ec93b158553ee68c0f49952435d07ddce0798ef11d12ccbe140e07d7c941671e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pipx = pipx.main:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs >=0.4
    - hatchling >=1.27
    - pip
    - docutils >=0.21
  run:
    - python >=${{ python_min }}
    - argcomplete >=3.7.2
    - platformdirs >=4.12.2
    - packaging >=26.3
    - filelock >=4.0.9
    - platformdirs >=2.1
    - userpath !=1.9,>=1.9.2
tests:
  - python:
      imports:
        - pipx
        - pipx.commands
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pipx --help

about:
  summary: Install and Run Python Applications in Isolated Environments
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pypa/pipx

extra:
  recipe-maintainers:
    - maresb
    - jsmolic
