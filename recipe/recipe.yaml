schema_version: 1

context:
  version: 1.18.18

package:
  name: pipx
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/pipx/pipx-${{ version }}.tar.gz
    sha256: b9984a65ac07bb2f90e1fb121f40d7316c72e3ce178924e135bdb9ec4b9ddc76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --check-build-dependencies
  python:
    entry_points:
      - pipx = pipx.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - python-sbom >=0.1.2
    - pip
    - docutils >=0.21.2
    - hatch-fancy-pypi-readme >=25.1
  run:
    - python >=${{ python_min }}
    - argcomplete >=3.7.2
    - platformdirs >=4.12.2
    - packaging >=26.3
    - filelock >=4.2
    - userpath !=1.9,>=1.9.2
    # Upstream needs colorama on Windows only; we ship a single noarch build, so it's
    # unconditional. The `if:` wrapper stops the bot's grayskull update from removing it.
    - if: true
      then: colorama >=0.4.6
tests:
  - python:
      imports:
        - pipx
        - pipx.commands
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pipx --help

about:
  summary: Install and Run Python Applications in Isolated Environments
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pypa/pipx

extra:
  recipe-maintainers:
    - maresb
    - jsmolic
